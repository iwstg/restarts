<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MYPOPOL</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            border: none;
        }
        body{
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
        }

        .Register-wrapper{
            width: 500px;
            height: 550px;
            padding: 40px;
            box-sizing: border-box;
        }

        .Register-wrapper > h2{
            font-size: 32px;
            color: #6A24FE;
            margin-bottom: 15px;
            text-align:center;
        }
        #Register-form > fieldset{
            width: 100%;
            height: 48px;
            padding: 0 10px;
            box-sizing: border-box;
            margin-bottom: 16px;
            border-radius: 6px;
            background-color: #F8F8F8;
        }
        #Register-form > input::placeholder{
            color: #D2D2D2;
        }
        #Register-form > button{
          width: 100%;
          height: 48px;
          padding: 0 10px;
          box-sizing: border-box;
          margin-bottom: 16px;
          border-radius: 6px;
          color: #fff;
          font-size: 16px;
          background-color: #6A24FE;
          margin-top: 3px;
        }

        #mains{
            margin:150px auto;
        }

        .hide {
            display: none;
        }

    </style>
</head>
<body>
<div id="mains" class="Register-wrapper">
    <h2>Regist</h2>
    <form id="Register-form" action="RegisterRequest" method="post">
        <fieldset>
            <input type="text" id="userId" placeholder="아이디" name="UserId">
        </fieldset>

        <div class="success-message-id hide">사용할 수 있는 아이디입니다</div>
        <div class="failure-message-id hide">이미 사용중인 아이디 입니다.</div>
        <div class="failure-message2-id hide">영어 또는 숫자만 가능합니다</div>
        <div class="failure-message3-id hide">아이디는 2~10글자이어야 합니다</div>

        <fieldset>
           <input type="text" id="userName" placeholder="별명" name="UserName">
        </fieldset>

        <div class="success-message-name hide">사용할 수 있는 별명입니다</div>
        <div class="failure-message-name hide">별명은 2~10글자이어야 합니다</div>
        <div class="failure-message2-name hide">한글과 영어 숫자의 조합만 가능합니다</div>

        <fieldset>
            <input type="text" id="userEmail" placeholder="이메일" name="UserEmail">
        </fieldset>

        <div class="success-message-email hide">사용할 수 있는 이메일입니다</div>
        <div class="failure-message-email hide">이메일 유형이 올바르지 않습니다</div>

        <fieldset>
            <input type="password" id="userpassword" placeholder="패스워드" name="UserPassword">
        </fieldset>

        <div class="success-message-password hide">사용할 수 있는 패스워드입니다</div>
        <div class="failure-message-password hide">패스워드는 8~16자리 알파벳과 숫자, 특수문자가 포함되어야 합니다</div>

        <fieldset>
            <input type="password" id="userpasswordcheck" placeholder="패스워드 확인" name="UserPassword">
        </fieldset>

        <div class="success-message-passwordcheck hide">패스워드가 일치합니다.</div>
        <div class="failure-message-passwordcheck hide">패스워드가 일치하지 않습니다.</div>


        <button type="submit" id="subm">회원가입</button>password
    </form>
</div>
</body>
</html>

<script>
    let InputUserId = document.querySelector('#userId');
    let IdSuccessMessage = document.querySelector('.success-message-id');
    let IdFailureMessage = document.querySelector('.failure-message-id');
    let IdFailureMessage2 = document.querySelector('.failure-message2-id');
    let IdFailureMessage3 = document.querySelector('.failure-message3-id');

    let InputUserName = document.querySelector('#userName');
    let NameSuccessMessage = document.querySelector('.success-message-name');
    let NameFailureMessage = document.querySelector('.failure-message-name');
    let NameFailureMessage2 = document.querySelector('.failure-message2-name');

    let InputUserEmail = document.querySelector('#userEmail');
    let EmailSuccessMessage = document.querySelector('.success-message-email');
    let EmailFailureMessage = document.querySelector('.failure-message-email');

    let InputUserPassword = document.querySelector('#userpassword');
    let PasswordSuccessMessage = document.querySelector('.success-message-password');
    let PasswordFailureMessage = document.querySelector('.failure-message-password');

    let InputUserPasswordcheck = document.querySelector('#userpasswordcheck');
    let PasswordcheckSuccessMessage = document.querySelector('.success-message-passwordcheck');
    let PasswordcheckFailureMessage = document.querySelector('.failure-message-passwordcheck');

    function idLengthCheck(value){
        return value.length >= 2 && value.length <= 10
    }

    function idavailability(str){
        return /^[A-Za-z0-9][A-Za-z0-9]*$/.test(str);
    }

    function Passwordavailability (str) {
        return /(?=.*[0-9])(?=.*[a-zA-Z])(?=.*\W)(?=\S+$).{8,16}/.test(str);
    }

    InputUserId.onkeyup = function () {
      // 값을 입력한 경우
      if (InputUserId.value.length !== 0) {
        if(idavailability(InputUserId.value) === false) {
          IdSuccessMessage.classList.add('hide');
          IdFailureMessage.classList.add('hide');
          IdFailureMessage2.classList.remove('hide'); // 영어 또는 숫자만 가능합니다
          IdFailureMessage3.classList.add('hide');
        }else if(idLengthCheck(InputUserId.value) === false) {
          IdSuccessMessage.classList.add('hide');
          IdFailureMessage.classList.add('hide');
          IdFailureMessage2.classList.add('hide');
          IdFailureMessage3.classList.remove('hide'); // 아이디는 4~12글자이어야 합니다
        }else if(idLengthCheck(InputUserId.value) && idavailability(InputUserId.value)) {
          IdSuccessMessage.classList.remove('hide');
          IdFailureMessage.classList.add('hide');
          IdFailureMessage2.classList.add('hide');
          IdFailureMessage3.classList.add('hide');
        }
      }else {
        IdSuccessMessage.classList.add('hide');
        IdFailureMessage.classList.add('hide');
        IdFailureMessage2.classList.add('hide');
        IdFailureMessage3.classList.add('hide');
      }
    }
</script>
