<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>로그인했습니다</title>
</head>
<body>
<h1> 메인페이지 </h1>
프로필 사진 <img th:src="@{'/ProfilImg/'+${userinfo.userProfilImg}}"/> <br><br>
로그인 아이디 : <span th:text="${userinfo.userID}">null</span> <br>
로그인 닉네임 : <span th:text="${userinfo.userName}">null</span> <br>
자기소개 : <span th:text="${userinfo.userIntroduce}">null</span> <br>

<form id="checkinfo" action="ChangeUserInfo" method="post">
    <button type="submit">회원정보 수정</button>
</form>

<form id="Logout-form" action="MainPageLogOut" method="post">
<button type="submit">로그아웃</button>
</form>
</body>
</html>
