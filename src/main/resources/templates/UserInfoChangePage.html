<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원정보 변경 페이지</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            border: none;
        }
        body{
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
        }

        .Register-wrapper{
            width: 500px;
            height: 550px;
            padding: 40px;
            box-sizing: border-box;
        }

        .Register-wrapper > h2{
            font-size: 32px;
            color: #6A24FE;
            margin-bottom: 15px;
            text-align:center;
        }
        #Register-form > input{
            width: 100%;
            height: 48px;
            padding: 0 10px;
            box-sizing: border-box;
            margin-bottom: 16px;
            border-radius: 6px;
            background-color: #F8F8F8;
        }
        #Register-form > input::placeholder{
            color: #D2D2D2;
        }
        #Register-form > button{
          width: 100%;
          height: 48px;
          padding: 0 10px;
          box-sizing: border-box;
          margin-bottom: 16px;
          border-radius: 6px;
          color: #fff;
          font-size: 16px;
          background-color: #6A24FE;
          margin-top: 3px;
        }

        #mains{
            margin:150px auto;
        }

        .hide {
            display: none;
        }

    </style>
</head>
<body>
<div id="mains" class="Register-wrapper">
    <h2>회원 정보 변경</h2>
    <form id="Register-form" th:action="@{/ChangeUserInfoData}" th:object="${userchange}" method="post">
        <input type="text" th:field="*{userName}" th:placeholder="${userinfo.userName}" th:value="${userinfo.userName}">
        <input type="text" th:field="*{userEmail}" th:placeholder="${userinfo.userEmail}" th:value="${userinfo.userEmail}">
        <input type="text" th:field="*{userIntroduce}" placeholder="자기소개를 입력해주세요" th:value="${userinfo.userIntroduce}">
        <input type="password" th:field="*{userPassword}" placeholder="패스워드">

        <button type="submit">변경</button>
    </form>
</div>

</body>
</html>
